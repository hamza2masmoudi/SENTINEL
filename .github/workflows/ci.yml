name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Lint with Ruff
        run: uv run ruff check src tests

      - name: Check formatting with Black
        run: uv run black --check src tests

      - name: Type check source
        run: uv run mypy --strict src/

      - name: Type check tests
        run: uv run mypy tests/ --ignore-missing-imports

      - name: Run test suite with coverage
        run: |
          uv run pytest --cov=sentinel --cov-report=term-missing --cov-report=xml --cov-fail-under=85 tests/

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run Bandit security scan
        run: uv run bandit -c pyproject.toml -r src/

      - name: Run Safety dependency check
        run: uv run safety check --ignore 70612 || true

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Build documentation strictly
        run: uv run mkdocs build --strict
